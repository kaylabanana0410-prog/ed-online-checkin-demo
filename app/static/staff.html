<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff console (demo)</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/static/staff.css" rel="stylesheet"></head><body>
<div class="demo-banner text-center py-1">Demonstration staff console. Synthetic data only. Not affiliated with St. Joseph's Health Centre.</div>
<main class="container-fluid py-3">
<section id="login" class="mx-auto" style="max-width:380px">
 <h1 class="h3">Staff sign-in</h1>
 <form id="lf"><div class="mb-2"><label class="form-label" for="u">Username</label><input id="u" class="form-control" autocomplete="username" required></div>
 <div class="mb-2"><label class="form-label" for="p">Password</label><input id="p" type="password" class="form-control" autocomplete="current-password" required></div>
 <div id="lerr" class="text-danger" role="alert"></div><button class="btn btn-primary mt-2">Sign in</button></form>
 <p class="small mt-3">No default accounts exist. Create them with <code>python -m app.manage seed-demo</code>.</p>
</section>
<section id="app" class="d-none">
 <div class="d-flex justify-content-between align-items-center mb-2"><h1 class="h4 mb-0">Pre-registrations</h1><div><span id="who" class="me-2"></span><button id="out" class="btn btn-sm btn-outline-secondary" type="button">Sign out</button></div></div>
 <div class="row g-3"><div class="col-lg-4"><label class="visually-hidden" for="q">Search by reference</label><input id="q" class="form-control mb-2" placeholder="Search by reference"><div id="list" class="list-group"></div></div>
 <div class="col-lg-8"><div id="detail">Select a submission.</div></div></div>
</section></main>
<script src="/static/staff.js" defer></script></body></html>
